<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffe5ef">
  <title>إلى أميرتي شعبوطه ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hearts" class="hearts"></div>

  <main class="site">
    <div class="topline">
      <span>🍓 رسالة خاصة إلى شعبوطه</span>
      <span>👑 للأميرة فقط</span>
    </div>

    <div class="progress-track">
      <div id="progress" class="progress"></div>
    </div>

    <section id="page" class="page">
      <div id="emoji" class="hero-emoji">🍓💗</div>
      <p id="eyebrow" class="eyebrow"></p>
      <h1 id="title"></h1>
      <p id="description" class="description"></p>
      <div id="content" class="content"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div id="actions" class="actions"></div>
      <p class="signature">من شعيوط إلى أميرته ❤️</p>
    </section>

    <footer>صُنع بكثير من الحب وشوية غباء من شعيوط 😂❤️</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
